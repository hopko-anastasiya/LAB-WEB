services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: labweb
      POSTGRES_USER: labweb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labweb}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labweb -d labweb"]
      interval: 5s
      timeout: 3s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck
    volumes:
      - blob-data:/data
    ports:
      - "127.0.0.1:10000:10000"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: labweb
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-labweb}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  web:
    build:
      context: .
      dockerfile: src/LabWeb/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: Host=db;Port=5432;Database=labweb;Username=labweb;Password=${POSTGRES_PASSWORD:-labweb}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Telegram__WebhookUrl: ${TELEGRAM_WEBHOOK_URL:-}
      Telegram__WebhookSecret: ${TELEGRAM_WEBHOOK_SECRET:-}
      Telegram__SiteUrl: ${SITE_URL:-}
      Auth__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Auth__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Auth__SystemAdmins__0: ${SYSTEM_ADMIN_EMAIL:-}
      DataProtection__KeysPath: /app/keys
      Storage__Blob__ConnectionString: ${BLOB_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
      Storage__Blob__PublicBaseUrl: ${BLOB_PUBLIC_URL:-http://localhost:10000/devstoreaccount1/uploads}
      RabbitMq__Host: rabbitmq
      RabbitMq__UserName: labweb
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-labweb}
      Ai__Gemini__ApiKey: ${GEMINI_API_KEY:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - uploads:/app/wwwroot/uploads
      - keys:/app/keys

volumes:
  db-data:
  uploads:
  keys:
  rabbitmq-data:
  blob-data:
